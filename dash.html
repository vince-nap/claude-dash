<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash</title>
<link rel="icon" href="/dash.png">
<style>
:root{--bg:#f7f6f3;--card:#fff;--ink:#1f1d1a;--mute:#6f6a62;--line:#e4e1da;--used:#2a6fdb;--proj:#2a6fdb;--task:#d9822b;--limit:#c93b3b;--ok:#2f8f5b;--grid:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1e1b;--ink:#ece9e3;--mute:#9a958b;--line:#33312c;--used:#6aa3ff;--proj:#6aa3ff;--task:#f0a657;--limit:#ff6b6b;--ok:#59c38a;--grid:#2a2926}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.ctl select,.ctl input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.tabs button{cursor:pointer}.tabs button[aria-pressed=true]{border-color:var(--used);color:var(--used);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-size:14px;margin:0 0 2px;font-weight:600}
.big{font-size:30px;font-weight:650;letter-spacing:-.02em}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:12.5px;margin:2px 0 6px}
.kv b{color:var(--ink);font-weight:600}
svg{width:100%;height:auto;display:block}
.ax{fill:var(--mute);font-size:11px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:14px 0}
.ctl label{display:flex;flex-direction:column;gap:3px;color:var(--mute);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--mute);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mute);font-weight:500}
tr.pick td{font-weight:650}
.fit{color:var(--ok)}.nofit{color:var(--limit)}
.err{color:var(--limit);padding:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Dash</h1><div class="sub" id="sub">loading…</div></div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div id="err" class="err" hidden></div>
  <div class="grid">
    <section class="card"><h2>Session · 5 hours</h2><div class="big" id="sBig"></div><div class="kv" id="sKv"></div><div id="sChart"></div></section>
    <section class="card"><h2>Weekly · 7 days</h2><div class="big" id="wBig"></div><div class="kv" id="wKv"></div><div id="wChart"></div></section>
  </div>
  <div class="legend">
    <span><i style="border-color:var(--used)"></i>consumed</span>
    <span><i style="border-color:var(--proj);border-top-style:dashed"></i>projected at current burn</span>
    <span><i style="border-color:var(--task)"></i>planned task</span>
    <span><i style="border-color:var(--limit);border-top-style:dashed"></i>limit (100%)</span>
  </div>

  <section class="card" style="margin-top:14px">
    <h2>Plan a task</h2>
    <div class="ctl">
      <label>Size<select id="size"></select></label>
      <label>Agents<input id="agents" type="number" min="1" max="50" value="1" style="width:80px"></label>
      <label>Model<select id="model"></select></label>
      <label>Effort<select id="effort"></select></label>
    </div>
    <table id="opts"></table>
    <div class="sub" style="margin-top:8px" id="note"></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id), HOUR=3600e3, q=new URLSearchParams(location.search);
let D=null, account=q.get('account')||'';
const fT=ms=>new Date(ms).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'});
const fIn=ms=>{const m=Math.round(ms/6e4);return m<60?m+'m':m<2880?(m/60).toFixed(1)+'h':(m/1440).toFixed(1)+'d'};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function estimate(size,model,effort,agents){
  const c=D.cal, s=c.sizes[size]*c.model[model]*c.effort[effort]*agents*(agents>1?1.15:1);
  return {s,w:s*c.weeklyPerSession};
}
function chart(el,p,taskPct,span){
  if(!p){el.innerHTML='<div class="sub">No limit data for this plan.</div>';return}
  const W=520,H=250,m={l:38,r:14,t:14,b:26},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const x=t=>m.l+(t-p.start)/(p.reset-p.start)*iw, y=v=>m.t+ih-(Math.min(v,115)/115)*ih;
  const now=D.now;
  let g='';
  for(const v of [0,25,50,75,100]) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--grid')}"/><text class="ax" x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
  const ticks=span===5*HOUR?5:7;
  for(let i=0;i<=ticks;i++){const t=p.start+(p.reset-p.start)*i/ticks;g+=`<text class="ax" x="${x(t)}" y="${H-8}" text-anchor="${i==0?'start':i==ticks?'end':'middle'}">${span===5*HOUR?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):new Date(t).toLocaleDateString([],{weekday:'short'})}</text>`}
  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(100)}" y2="${y(100)}" stroke="${css('--limit')}" stroke-dasharray="5 4"/>`;
  // consumed
  const pts=[{t:p.start,pct:0},...p.points.filter(a=>a.t<=now),{t:now,pct:p.pct}];
  const line=pts.map((a,i)=>`${i?'L':'M'}${x(a.t)},${y(a.pct)}`).join('');
  g+=`<path d="${line}L${x(now)},${y(0)}L${x(p.start)},${y(0)}Z" fill="${css('--used')}" opacity=".12"/><path d="${line}" fill="none" stroke="${css('--used')}" stroke-width="2.2"/>`;
  // projection (capped where it hits 100)
  const endT=p.limitAt||p.reset, endV=p.limitAt?100:Math.min(100,p.projectedAtReset);
  g+=`<path d="M${x(now)},${y(p.pct)}L${x(endT)},${y(endV)}" stroke="${css('--proj')}" stroke-width="2" stroke-dasharray="6 4" fill="none"/>`;
  // task overlay: step at now
  let tEnd=null;
  if(taskPct>0){tEnd=p.pct+taskPct;
    g+=`<path d="M${x(now)},${y(p.pct)}L${x(now)},${y(tEnd)}" stroke="${css('--task')}" stroke-width="5" stroke-linecap="round"/>`;
    g+=`<path d="M${x(now)},${y(tEnd)}L${x(p.reset)},${y(Math.min(115,tEnd+Math.max(0,p.projectedAtReset-p.pct)))}" stroke="${css('--task')}" stroke-width="1.8" stroke-dasharray="3 4" fill="none"/>`;
    g+=`<text class="ax" x="${x(now)+8}" y="${y(tEnd)-4}" fill="${css('--task')}" style="fill:${css('--task')}">${tEnd>100?'over by '+(tEnd-100).toFixed(0)+'%':'+'+taskPct.toFixed(1)+'%'}</text>`}
  g+=`<line x1="${x(now)}" x2="${x(now)}" y1="${m.t}" y2="${m.t+ih}" stroke="${css('--mute')}" stroke-dasharray="2 3"/><text class="ax" x="${x(now)}" y="${m.t-3}" text-anchor="middle">now</text>`;
  if(p.limitAt) g+=`<circle cx="${x(p.limitAt)}" cy="${y(100)}" r="4.5" fill="${css('--limit')}"/><text class="ax" x="${x(p.limitAt)-6}" y="${y(100)-8}" text-anchor="end" style="fill:${css('--limit')}">limit ${fT(p.limitAt)}</text>`;
  g+=`<line x1="${W-m.r}" x2="${W-m.r}" y1="${m.t}" y2="${m.t+ih}" stroke="${css('--ok')}" stroke-width="2"/>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="usage chart">${g}</svg>`;
}
function render(){
  const s=D.proj?.session, w=D.proj?.weekly;
  const a=D.accounts.find(a=>a.key===D.account);
  $('sub').textContent=`${a?.email||D.account} · ${D.plan} · updated ${new Date(D.now).toLocaleTimeString()}`;
  $('tabs').innerHTML=D.accounts.map(a=>`<button aria-pressed="${a.key===D.account}" data-k="${a.key}">${a.key} · ${a.plan}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{account=b.dataset.k;load()});
  $('err').hidden=!D.err; $('err').textContent=D.err||'';
  const kv=(p,span)=>p?`<span>burn <b>${p.rate.toFixed(1)}%/h</b> (${p.basis})</span><span>projected at reset <b>${Math.min(999,p.projectedAtReset).toFixed(0)}%</b></span><span>${p.limitAt?`limit hit <b style="color:var(--limit)">${fT(p.limitAt)}</b> (in ${fIn(p.limitAt-D.now)})`:'<b style="color:var(--ok)">no limit hit before reset</b>'}</span><span>resets <b>${fT(p.reset)}</b> (in ${fIn(p.reset-D.now)})</span>`:'';
  $('sBig').textContent=s?s.pct+'%':'—'; $('wBig').textContent=w?w.pct+'%':'—';
  $('sKv').innerHTML=kv(s); $('wKv').innerHTML=kv(w);
  const t=cur();
  chart($('sChart'),s,t?.s||0,5*HOUR); chart($('wChart'),w,t?.w||0,7*24*HOUR);
  table();
}
function cur(){ if(!D?.cal) return null; return estimate($('size').value,$('model').value,$('effort').value,Math.max(1,+$('agents').value||1)) }
function table(){
  if(!D.proj?.session){ $('opts').innerHTML=''; return }
  const s=D.proj.session,w=D.proj.weekly,size=$('size').value,ag=Math.max(1,+$('agents').value||1);
  let h='<tr><th>Model</th><th>Effort</th><th>Session</th><th>Week</th><th>Verdict</th></tr>';
  for(const m of Object.keys(D.cal.model)) for(const e of ['low','medium','high','max']){
    const c=estimate(size,m,e,ag), fs=s.pct+c.s<=100, fw=w.projectedAtReset+c.w<=100;
    const sel=m===$('model').value&&e===$('effort').value;
    h+=`<tr class="${sel?'pick':''}"><td>${m}</td><td>${e}</td><td>${c.s.toFixed(1)}%</td><td>${c.w.toFixed(1)}%</td><td class="${fs&&fw?'fit':'nofit'}">${fs&&fw?'fits':!fs?'exceeds session':'tight for week'}</td></tr>`;
  }
  $('opts').innerHTML=h;
  const per=estimate(size,$('model').value,$('effort').value,1).s*1.15;
  $('note').textContent=`Agents that fit this session at ${$('model').value}/${$('effort').value} with 20% headroom: ${Math.max(1,Math.floor((100-s.pct)*.8/per))}. Estimates are seeded and recalibrate as you run \`dash done\`.`;
}
function fill(sel,items,v){ if(!sel.options.length){sel.innerHTML=items.map(i=>`<option>${i}</option>`).join('');sel.value=v} }
async function load(){
  const r=await fetch('/api/data?account='+encodeURIComponent(account)); D=await r.json(); account=D.account;
  fill($('size'),Object.keys(D.cal.sizes),(q.get('plan')||'M').split(',')[0]);
  if(q.get('plan')&&!window._p){$('agents').value=q.get('plan').split(',')[1]||1;window._p=1}
  fill($('model'),Object.keys(D.cal.model),'sonnet'); fill($('effort'),Object.keys(D.cal.effort),'medium');
  render();
}
['size','agents','model','effort'].forEach(i=>$(i).addEventListener('input',()=>D&&render()));
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>D&&render());
load(); setInterval(load,60000);
</script>
</body>
</html>
